[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quickpub"
version = "4.1.2"
authors = [
    { name = "danielnachumdev", email = "danielnachumdev@gmail.com" },
]
dependencies = [
    "danielutils>=1.1.23",
    "requests",
    "fire",
    "twine",
]
keywords = []
license = { "file" = "./LICENSE" }
description = "A local CI/CD simulation tool that runs quality checks, tests, and validations locally before publishing Python packages, ensuring higher build pass rates and faster feedback loops"
readme = {file = "./README.md", content-type = "text/markdown"}
requires-python = ">=3.8.0"
classifiers = [
	"Development Status :: 5 - Production/Stable",
	"Environment :: Console",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
	"Programming Language :: Python",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.8",
	"Programming Language :: Python :: 3.9",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: Software Development :: Build Tools",
	"Topic :: Software Development :: Libraries :: Python Modules",
	"Topic :: Software Development :: Quality Assurance",
	"Typing :: Typed",
]
[project.scripts]
    quickpub = "quickpub.__main__:main"

[tool.setuptools]
packages = ["quickpub"]

[tool.setuptools.package-data]
"quickpub" = ["py.typed"]

[project.urls]
"Homepage" = "https://github.com/danielnachumdev/quickpub"
"Bug Tracker" = "https://github.com/danielnachumdev/quickpub/issues"

[dependency-groups]
dev = [
    "githooklib>=1.0.0",
    "tqdm",
    "pylint",
    "mypy",
    "types-tqdm",
    "types-requests",
    "beautifulsoup4",
    "setuptools",
    "black",
]
test = [
    "pytest",
    "pytest-xdist",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.uv]
default-groups = ["dev", "test"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-q",
    "--strict-markers",
    "--tb=short",
    "--cov",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--color=yes",
    "--durations=10",
    "--maxfail=10",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["quickpub"]
branch = false
parallel = false

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 50
sort = "Cover"

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
disallow_untyped_calls = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
namespace_packages = true
explicit_package_bases = true
files = ["quickpub/*.py", "tests", "publish.py"]

[[tool.mypy.overrides]]
module = "*"
ignore_missing_imports = true

[tool.pylint.main]
ignore-paths = ["^tests/.*", "^tmp/.*"]

[tool.pylint.basic]
good-names = ["foo", "bar"]
good-names-rgxs = ["^[a-zA-Z]"]

[tool.pylint.naming]
class-rgx = "^(_)?[A-Z][a-zA-Z0-9]*$"
module-rgx = "^[a-zA-Z][a-zA-Z0-9_]*$"

[tool.pylint.messages_control]
disable = [
    "W0211",
    "C0114",
    "E1120",
    "E0611",
    "W0702",
    "W0612",
    "R0913",
    "C0415",
    "R0912",
    "R0903",
    "R0914",
    "R0911",
    "R1716",
    "W0401",
    "R0801",
    "C0116",
    "W0212",
    "C0115",
]

[tool.pylint.format]
max-line-length = 120
